<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>
  <text x="30" y="42" font-size="22" font-weight="bold" fill="#1f2328">新干线车厢与座位：指定席、自由席、特大行李区</text>
  <text x="30" y="68" font-size="14" fill="#5b6472">以东海道·山阳新干线（希望号等）普通车为例，不同车种编组略有差别，按当日的车厢指示为准。</text>
  <rect x="60" y="110" width="110" height="120" rx="10" fill="#ffecec" stroke="#c0392b" stroke-width="2"/>
  <text x="115" y="140" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1 号车</text>
  <text x="115" y="164" font-size="12" fill="#1f2328" text-anchor="middle">指定席</text>
  <text x="115" y="184" font-size="11" fill="#5b6472" text-anchor="middle">（含特大行李</text>
  <text x="115" y="198" font-size="11" fill="#5b6472" text-anchor="middle">座位）</text>
  <g>
    <rect x="176" y="110" width="110" height="120" rx="10" fill="#eef4ff" stroke="#0b62c4" stroke-width="2"/>
    <text x="231" y="140" font-size="14" font-weight="bold" fill="#0b62c4" text-anchor="middle">2–3 号车</text>
    <text x="231" y="164" font-size="12" fill="#1f2328" text-anchor="middle">指定席</text>
    <text x="231" y="188" font-size="11" fill="#5b6472" text-anchor="middle">部分车次设</text>
    <text x="231" y="202" font-size="11" fill="#5b6472" text-anchor="middle">特大行李位</text>
  </g>
  <rect x="292" y="110" width="150" height="120" rx="10" fill="#f7f9ff" stroke="#0b62c4" stroke-width="2"/>
  <text x="367" y="140" font-size="14" font-weight="bold" fill="#0b62c4" text-anchor="middle">4–6 号车</text>
  <text x="367" y="164" font-size="12" fill="#1f2328" text-anchor="middle">指定席（可加购</text>
  <text x="367" y="180" font-size="12" fill="#1f2328" text-anchor="middle">特大行李位）</text>
  <rect x="448" y="110" width="150" height="120" rx="10" fill="#e9fbf2" stroke="#0f8a5f" stroke-width="2"/>
  <text x="523" y="140" font-size="14" font-weight="bold" fill="#0f8a5f" text-anchor="middle">7–9 号车</text>
  <text x="523" y="164" font-size="12" fill="#1f2328" text-anchor="middle">部分车次设</text>
  <text x="523" y="180" font-size="12" fill="#1f2328" text-anchor="middle">自由席</text>
  <text x="523" y="202" font-size="11" fill="#5b6472" text-anchor="middle">有座就坐，不对号</text>
  <rect x="604" y="110" width="236" height="120" rx="10" fill="#fff4e6" stroke="#d98410" stroke-width="2"/>
  <text x="722" y="140" font-size="14" font-weight="bold" fill="#d98410" text-anchor="middle">绿色车厢（グリーン車）</text>
  <text x="722" y="164" font-size="12" fill="#1f2328" text-anchor="middle">更宽座位，需另买绿色券</text>
  <text x="722" y="188" font-size="12" fill="#1f2328" text-anchor="middle">持 JR PASS 也需补绿色券</text>
  <text x="60" y="266" font-size="13.5" fill="#c0392b">规则要点：行李箱「长+宽+高」合计 161–250cm 属特大行李，坐东海道·山阳·九州新干线必须预约「特大行李位」；</text>
  <text x="60" y="288" font-size="13.5" fill="#c0392b">没有预约就带上去会被收 1,000 日元行李手续费。160cm 以内的普通行李箱放头顶行李架或座位前方即可。</text>
  <text x="60" y="314" font-size="12.5" fill="#5b6472">来源：JR 东海「Luggage information / Oversized baggage」官方页面。</text>
</svg>
