<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="984" height="486" viewBox="0 0 984 486" font-family="Microsoft YaHei, Noto Sans SC, sans-serif">
  <rect width="984" height="486" fill="#ffffff"/>
  <text x="26" y="40" font-size="21" font-weight="bold" fill="#1f2328">JR 集团标志速查（关西最常遇到的三个「JR」）</text>
  <text x="26" y="68" font-size="13" fill="#5b6472">同一个「JR」标志，用颜色区分公司：蓝色＝JR 西日本（关西）、橙色＝JR 东海、绿色＝JR 东日本。看闸机、看指示牌时</text>
  <text x="26" y="88" font-size="13" fill="#5b6472">先认颜色。</text>
  <rect x="26" y="104" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="97" y="116" width="159" height="86" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="176" y="226" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 西日本</text>
  <text x="176" y="248" font-size="12.5" fill="#5b6472" text-anchor="middle">蓝色・关西主力</text>
  <rect x="342" y="104" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="413" y="116" width="159" height="86" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="492" y="226" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 东海</text>
  <text x="492" y="248" font-size="12.5" fill="#5b6472" text-anchor="middle">橙色・新干线/名古屋</text>
  <rect x="658" y="104" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="729" y="116" width="159" height="86" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="808" y="226" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 东日本</text>
  <text x="808" y="248" font-size="12.5" fill="#5b6472" text-anchor="middle">绿色・关东/Suica</text>
  <rect x="26" y="288" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="118" y="300" width="117" height="86" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="176" y="410" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 西日本 公司标志</text>
  <text x="176" y="432" font-size="12.5" fill="#5b6472" text-anchor="middle">全称：西日本旅客铁道</text>
  <rect x="342" y="288" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="444" y="308" width="96" height="71" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="492" y="410" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 东海 公司标志</text>
  <text x="492" y="432" font-size="12.5" fill="#5b6472" text-anchor="middle">全称：东海旅客铁道</text>
  <rect x="658" y="288" width="300" height="168" rx="12" fill="#fbfcfe" stroke="#e2e6ec"/>
  <image x="749" y="311" width="118" height="64" xlink:href="data:image/svg+xml;base64," preserveAspectRatio="xMidYMid meet"/>
  <text x="808" y="410" font-size="15" font-weight="bold" fill="#1f2328" text-anchor="middle">JR 东日本 公司标志</text>
  <text x="808" y="432" font-size="12.5" fill="#5b6472" text-anchor="middle">全称：东日本旅客铁道</text>
  <text x="26" y="474" font-size="12" fill="#8a93a2">标识与商标版权归各公司所有，此处仅用于乘车识读说明。</text>
</svg>
